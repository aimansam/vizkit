[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vizkit"
version = "1.0.0"
description = "Publication-quality charts from CSV and JSON data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0.0"]

[tool.setuptools.packages.find]
include = ["vizkit*"]
